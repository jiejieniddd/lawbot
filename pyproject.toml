[project]
name = "lawbot-workspace"
version = "0.1.0"
description = "CareerBot monorepo workspace"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/lawbot"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api", "apps/worker", "packages/lawbot"]
