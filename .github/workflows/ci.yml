name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync and test
        run: |
          uv sync --all-packages
          uv run pytest apps/api/tests -q
