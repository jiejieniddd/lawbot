[project]
name = "lawbot-api"
version = "0.1.0"
description = "LawBot FastAPI application"
requires-python = ">=3.12"
dependencies = [
  "lawbot",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
]

[tool.uv.sources]
lawbot = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
lawbot-seed = "app.seed:main"
