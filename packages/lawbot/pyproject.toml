[project]
name = "lawbot"
version = "0.1.0"
description = "LawBot shared domain, db, rag, and agent"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "python-jose[cryptography]>=3.3",
  "cryptography>=43.0",
  "litellm>=1.50",
  "datasets>=3.0",
  "qdrant-client>=1.12",
  "opensearch-py>=2.7",
  "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lawbot"]
