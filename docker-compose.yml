services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lawbot
      POSTGRES_PASSWORD: lawbot
      POSTGRES_DB: lawbot
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawbot -d lawbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # In-network URLs must use compose service names (do not inherit localhost from .env)
      DATABASE_URL: postgresql+psycopg://lawbot:lawbot@postgres:5432/lawbot
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      JWT_SECRET: ${JWT_SECRET:-compose-dev-secret-change-me}
      SECRET_KEY: ${JWT_SECRET:-compose-dev-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-root}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Aa@123456}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081,http://localhost:5173,http://localhost:5174}
      LITELLM_MODEL: ${LITELLM_MODEL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-lawbot_articles_v1}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-lawbot_articles_v1}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-500}
      RETRIEVER_MODE: ${RETRIEVER_MODE:-hybrid}
      RETRIEVER_TOP_K: ${RETRIEVER_TOP_K:-5}
      RRF_K: ${RRF_K:-60}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      HF_DATASET_ID: ${HF_DATASET_ID:-senry5433/china-effective-laws-regulations}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      opensearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://lawbot:lawbot@postgres:5432/lawbot
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-500}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-lawbot_articles_v1}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-lawbot_articles_v1}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      HF_DATASET_ID: ${HF_DATASET_ID:-senry5433/china-effective-laws-regulations}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      opensearch:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${ADMIN_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  qdrantdata:
  osdata:
